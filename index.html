<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 파비콘: 보라 바탕 + 지도 핀 + 하트(추억). SVG 를 못 쓰는 브라우저는 PNG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- 휴대폰 홈 화면에 추가할 때 아이콘 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 휴대폰 브라우저 주소창 색을 상단바와 맞춘다 -->
    <meta name="theme-color" content="#6b5b95" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2e2742" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>보충만의 추억</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
